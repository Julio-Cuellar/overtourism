# Perfil de desarrollo y demo: mvn spring-boot:run -Dspring-boot.run.profiles=desarrollo
# Habilita el canal de codigos simulado de Identidad, que no envia nada y deja leer el ultimo codigo en
# GET /dev/canal/codigo, y los repositorios en memoria. NUNCA en un servidor que alguien mas pueda alcanzar.
identidad:
  canal-simulado:
    habilitado: true
# Documentacion interactiva: http://localhost:8080/swagger-ui.html (contrato generado en /v3/api-docs). Solo REST; GraphQL no aparece.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Credenciales SOLO de desarrollo (base local en 127.0.0.1:5433). Fuera de este perfil no hay valor por omisión y la
# aplicación no arranca. El dueño (postgres) corre Flyway; la aplicación entra con un rol sin superusuario para que
# la seguridad por fila se aplique igual que en producción.
spring:
  datasource:
    username: negocio360_app
    password: root
  flyway:
    user: postgres
    password: root
    placeholders:
      app_user: negocio360_app

# F4 en demo: Ventas, Caja y el canal GraphQL con repositorios en memoria y Catalogo, Pasaporte y permisos SIMULADOS
# (D-90). Todas las sesiones sin negocio usan este negocio de demostracion. Los datos se pierden al reiniciar.
negocio360:
  demo:
    habilitada: true
    negocio-id: 0192f000-0000-7000-8000-000000000360
    # Flutter web y el navegador en la misma laptop (la app movil no necesita CORS).
    cors-origenes: http://localhost:*,http://127.0.0.1:*
