# Perfil de desarrollo y demo: mvn spring-boot:run -Dspring-boot.run.profiles=desarrollo
# Habilita el canal de codigos simulado de Identidad, que no envia nada y deja leer el ultimo codigo en
# GET /dev/canal/codigo, y los repositorios en memoria. NUNCA en un servidor que alguien mas pueda alcanzar.
identidad:
  canal-simulado:
    habilitado: true
# Documentacion interactiva: http://localhost:8080/swagger-ui.html (contrato generado en /v3/api-docs). Solo REST; GraphQL no aparece.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Credenciales SOLO de desarrollo (base local en 127.0.0.1:5433). Fuera de este perfil no hay valor por omisión y la
# aplicación no arranca. El dueño (postgres) corre Flyway; la aplicación entra con un rol sin superusuario para que
# la seguridad por fila se aplique igual que en producción.
spring:
  datasource:
    username: negocio360_app
    password: root
  flyway:
    user: postgres
    password: root
    placeholders:
      app_user: negocio360_app

# Ventas, Caja e Inventario con almacenes en memoria (F2 a F4 de docs/planes/integracion-ventas-caja.md): los datos se
# pierden al reiniciar. La version con PostgreSQL llega en F6; con el perfil de produccion estos modulos no se encienden.
ventas:
  almacen: memoria
  productos-simulados: true
caja:
  almacen: memoria

# Restaurantes (R1): menu y seguimiento de Negocios en memoria hasta que llegue la persistencia (R7). Se pierde al reiniciar.
restaurantes:
  almacen: memoria

# Inventario: articulos, saldos y consumo por venta en memoria (R-I1 a R-I4, lo usa Restaurantes). Se pierde al reiniciar.
inventario:
  almacen: memoria
